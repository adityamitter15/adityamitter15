<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="t d">
<title id="t">Aditya Mitter</title>
<desc id="d">A sonar ping spreads from a point, bounces off a curved surface and returns as an echo. Below it a line draws itself with a tick on each peak. Text: Aditya Mitter, software that measures the physical world, then shows where it fails.</desc>
<style>text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.ring{fill:none;stroke-width:3;vector-effect:non-scaling-stroke;transform-box:fill-box;transform-origin:center;animation:ping 12s cubic-bezier(.2,.55,.4,1) infinite}.out{stroke:#8fa2f5}.back{stroke:#c9a96e;stroke-dasharray:10 8}.d1{animation-delay:0s}.d2{animation-delay:-4s}.d3{animation-delay:-8s}@keyframes ping{0%{transform:scale(.02);opacity:.85}100%{transform:scale(1);opacity:0}}.tr{fill:none;stroke:#8fa2f5;stroke-width:3;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:1;animation:draw 12s linear infinite}@keyframes draw{0%,6%{stroke-dashoffset:1;opacity:0}8%{opacity:1}78%,90%{stroke-dashoffset:0;opacity:1}98%{stroke-dashoffset:0;opacity:0}100%{stroke-dashoffset:1;opacity:0}}.tk{fill:#c9a96e}@keyframes k0{0%,24.0%{opacity:0}26.0%,88%{opacity:1}96%,100%{opacity:0}}.k0{animation:k0 12s linear infinite}@keyframes k1{0%,35.0%{opacity:0}37.0%,88%{opacity:1}96%,100%{opacity:0}}.k1{animation:k1 12s linear infinite}@keyframes k2{0%,45.9%{opacity:0}47.9%,88%{opacity:1}96%,100%{opacity:0}}.k2{animation:k2 12s linear infinite}@keyframes k3{0%,56.9%{opacity:0}58.9%,88%{opacity:1}96%,100%{opacity:0}}.k3{animation:k3 12s linear infinite}@keyframes k4{0%,67.8%{opacity:0}69.8%,88%{opacity:1}96%,100%{opacity:0}}.k4{animation:k4 12s linear infinite}@media (prefers-reduced-motion:reduce){.ring,.tr,.tk{animation:none}.tr{stroke-dashoffset:0;opacity:1}.tk{opacity:1}.d1{transform:scale(.3);opacity:.7}.d2{transform:scale(.52);opacity:.45}.d3{transform:scale(.74);opacity:.25}}</style>
<rect width="1000" height="420" rx="18" fill="#151513"/>
<rect x=".75" y=".75" width="998.5" height="418.5" rx="17.5" fill="none" stroke="#4a4943" stroke-width="1.5" opacity=".55"/>
<defs><clipPath id="c"><rect width="290" height="300"/></clipPath></defs>
<g clip-path="url(#c)"><circle class="ring out d1" cx="90" cy="150" r="400"/><circle class="ring out d2" cx="90" cy="150" r="400"/><circle class="ring out d3" cx="90" cy="150" r="400"/><circle class="ring back d1" cx="490" cy="150" r="400"/><circle class="ring back d2" cx="490" cy="150" r="400"/><circle class="ring back d3" cx="490" cy="150" r="400"/></g>
<path d="M290 40Q308 150 290 260" fill="none" stroke="#4a4943" stroke-width="6" stroke-linecap="round"/>
<circle cx="90" cy="150" r="8" fill="#8fa2f5"/>
<text x="340" y="132" font-size="80" font-weight="700" fill="#f1efe9">Aditya Mitter</text>
<text x="342" y="190" font-size="38" fill="#a9a69d">Software that measures</text>
<text x="342" y="236" font-size="38" fill="#a9a69d">the physical world.</text>
<text x="342" y="282" font-size="38" fill="#a9a69d">Then shows where it fails.</text>
