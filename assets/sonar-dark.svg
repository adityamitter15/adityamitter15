<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 310" role="img" aria-labelledby="t d">
<title id="t">Sonar Reps, schematic</title>
<desc id="d">Schematic, not a recording. A phone lies face up and sends out rings. A chest above it moves up and down, and a line beside it rises and falls in step, with a tick on each peak.</desc>
<style>text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.ring{fill:none;stroke:#8fa2f5;stroke-width:3;vector-effect:non-scaling-stroke;transform-box:fill-box;transform-origin:center;animation:ping 6s cubic-bezier(.2,.55,.4,1) infinite}.r2{animation-delay:-3s}@keyframes ping{0%{transform:scale(.03);opacity:.8}100%{transform:scale(1);opacity:0}}.bob{animation:bob 6s cubic-bezier(.37,0,.63,1) infinite}@keyframes bob{0%,100%{transform:translateY(24px)}50%{transform:translateY(-24px)}}.dot{animation:dot 6s cubic-bezier(.37,0,.63,1) infinite}@keyframes dot{0%,100%{transform:translateY(0)}50%{transform:translateY(80px)}}.scroll{animation:scroll 6s linear infinite}@keyframes scroll{to{transform:translateX(-140px)}}@media (prefers-reduced-motion:reduce){.ring,.bob,.dot,.scroll{animation:none}.ring{transform:scale(.5);opacity:.5}.r2{transform:scale(.85);opacity:.25}}</style>
<rect width="800" height="310" rx="18" fill="#151513"/>
<rect x=".75" y=".75" width="798.5" height="308.5" rx="17.5" fill="none" stroke="#4a4943" stroke-width="1.5" opacity=".55"/>
<defs><clipPath id="c"><rect width="320" height="248"/></clipPath><clipPath id="w"><rect x="340" y="30" width="440" height="220"/></clipPath><linearGradient id="g"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".25" stop-color="#fff"/></linearGradient><mask id="m"><rect x="340" y="30" width="440" height="220" fill="url(#g)"/></mask></defs>
<g clip-path="url(#c)"><circle class="ring" cx="160" cy="248" r="200"/><circle class="ring r2" cx="160" cy="248" r="200"/></g>
<rect x="110" y="244" width="100" height="12" rx="6" fill="#8fa2f5"/>
<g class="bob"><path d="M70 100Q160 76 250 100" fill="none" stroke="#f1efe9" stroke-width="3" stroke-linecap="round"/></g>
<path d="M760 40V240" stroke="#4a4943" stroke-width="1.5" stroke-dasharray="4 6"/>
<g mask="url(#m)"><g class="scroll"><path d="M340 100L350 104L360 115L370 131L380 149L390 165L400 176L410 180L420 176L430 165L440 149L450 131L460 115L470 104L480 100L490 104L500 115L510 131L520 149L530 165L540 176L550 180L560 176L570 165L580 149L590 131L600 115L610 104L620 100L630 104L640 115L650 131L660 149L670 165L680 176L690 180L700 176L710 165L720 149L730 131L740 115L750 104L760 100L770 104L780 115L790 131L800 149L810 165L820 176L830 180L840 176L850 165L860 149L870 131L880 115L890 104L900 100L910 104L920 115" fill="none" stroke="#8fa2f5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="900" cy="84" r="5" fill="#c9a96e"/><circle cx="760" cy="84" r="5" fill="#c9a96e"/><circle cx="620" cy="84" r="5" fill="#c9a96e"/><circle cx="480" cy="84" r="5" fill="#c9a96e"/><circle cx="340" cy="84" r="5" fill="#c9a96e"/></g></g>
<circle class="dot" cx="760" cy="100" r="6" fill="#8fa2f5"/>
<text x="160" y="292" font-size="26" text-anchor="middle" fill="#a9a69d">phone on the floor</text>
<text x="560" y="292" font-size="26" text-anchor="middle" fill="#a9a69d">chest movement over time</text>
</svg>
