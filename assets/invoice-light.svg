<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 270" role="img" aria-labelledby="t d">
<title id="t">Invoice OCR, schematic</title>
<desc id="d">Schematic. A handwritten line is read left to right and becomes typed text. The typed text moves to a review card, where a correction is underlined and the card is approved with a tick.</desc>
<style>text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.sc{fill:none;stroke:#55534c;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;animation:sc 12s linear infinite}@keyframes sc{0%{stroke-dashoffset:1;opacity:1}16%,88%{stroke-dashoffset:0;opacity:1}96%{stroke-dashoffset:0;opacity:0}100%{stroke-dashoffset:1;opacity:0}}.scan{stroke:#8a6a1c;stroke-width:3;stroke-linecap:round;animation:scan 12s linear infinite}@keyframes scan{0%,20%{transform:translateX(0);opacity:0}23%{opacity:.9}47%{transform:translateX(280px);opacity:.9}50%,100%{transform:translateX(280px);opacity:0}}.rev{transform-box:fill-box;transform-origin:left center;animation:rev 12s linear infinite}@keyframes rev{0%,20%{transform:scaleX(0)}47%,100%{transform:scaleX(1)}}.ty{animation:ty 12s linear infinite}@keyframes ty{0%,90%{opacity:1}96%,100%{opacity:0}}.flow{stroke:#b9b6ab;stroke-width:3;stroke-linecap:round;stroke-dasharray:2 14;animation:flow 6s linear infinite}@keyframes flow{to{stroke-dashoffset:-48}}.fix{stroke:#8a6a1c;stroke-width:3;stroke-linecap:round;transform-box:fill-box;transform-origin:left center;animation:fix 12s linear infinite}@keyframes fix{0%,56%{transform:scaleX(0)}64%,90%{transform:scaleX(1)}96%,100%{transform:scaleX(0)}}.ok{fill:none;stroke:#3347c8;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;animation:ok 12s linear infinite}@keyframes ok{0%,70%{stroke-dashoffset:1;opacity:1}80%,90%{stroke-dashoffset:0;opacity:1}96%{stroke-dashoffset:0;opacity:0}100%{stroke-dashoffset:1;opacity:0}}@media (prefers-reduced-motion:reduce){.sc,.scan,.rev,.flow,.fix,.ok,.ty{animation:none}.sc,.ok{stroke-dashoffset:0}.scan{opacity:0}.rev,.fix{transform:none}}</style>
